<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Dizily uygulama logosu</title>
  <desc id="desc">Koyu bordo zemin üzerinde kırmızı ve altın Dizily logosu, oynat simgesi ve ilerleme çubuğu.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a0005"/>
      <stop offset="0.48" stop-color="#5b070d"/>
      <stop offset="1" stop-color="#160004"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff3948"/>
      <stop offset="0.52" stop-color="#d30d22"/>
      <stop offset="1" stop-color="#7b0010"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1ad"/>
      <stop offset="0.38" stop-color="#f3c357"/>
      <stop offset="1" stop-color="#9b5a16"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3a44"/>
      <stop offset="0.72" stop-color="#f5c45d"/>
      <stop offset="1" stop-color="#7d101b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".42"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <path d="M0 360 C118 312 230 422 512 307" fill="none" stroke="#b40b1f" stroke-width="18" opacity=".38"/>
  <path d="M0 405 C155 350 275 455 512 350" fill="none" stroke="#ff2037" stroke-width="7" opacity=".42" filter="url(#glow)"/>
  <g filter="url(#shadow)" font-family="Arial Black, Inter, system-ui, sans-serif" font-weight="900" text-anchor="middle">
    <text x="256" y="283" font-size="112" letter-spacing="-9" fill="url(#gold)" stroke="#6d2108" stroke-width="2">DIZILY</text>
    <path d="M229 205 L286 243 L229 281 Z" fill="url(#red)" stroke="#ff6b72" stroke-width="4"/>
  </g>
  <g transform="translate(78 340)">
    <rect width="336" height="12" rx="6" fill="#2d0a0e"/>
    <rect width="280" height="12" rx="6" fill="url(#bar)" filter="url(#glow)"/>
    <circle cx="296" cy="6" r="15" fill="#f4c55f" stroke="#7a2509" stroke-width="5"/>
    <circle cx="296" cy="6" r="7" fill="#fff2ad"/>
  </g>
</svg>